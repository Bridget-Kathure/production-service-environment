
services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/docker-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - service-a
    restart: unless-stopped
    networks:
      - app-network

  service-a:
    build:
      context: .
      dockerfile: services/service-a/Dockerfile
    container_name: service-a
    expose:
      - "3001"
    restart: unless-stopped
    networks:
      - app-network

  service-b:
    build:
      context: .
      dockerfile: services/service-b/Dockerfile
    container_name: service-b
    expose:
      - "3002"
    restart: unless-stopped
    networks:
      - app-network

  service-c:
    build:
      context: .
      dockerfile: services/service-c/Dockerfile
    container_name: service-c
    expose:
      - "3003"
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
